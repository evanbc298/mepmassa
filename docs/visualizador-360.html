<script>
(function(){
  const outer = document.getElementById('outer');
  const wrap = document.getElementById('wrap');
  function fit(){
    const s = Math.min(outer.clientWidth / 900, outer.clientHeight / 900);
    wrap.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  const rig = document.getElementById('rig');
  let angle = -20, dragging = false, lastX = 0, vel = 0, idle = true;

  function render(){ rig.style.transform = 'translate(-50%,-50%) rotateX(-7deg) rotateY(' + angle + 'deg)'; }

  function down(x){ dragging = true; idle = false; lastX = x; vel = 0; rig.classList.add('dragging'); }
  function move(x){ if(!dragging) return; const dx = x - lastX; lastX = x; angle += dx * 0.4; vel = dx * 0.4; render(); }
  function up(){ dragging = false; rig.classList.remove('dragging'); setTimeout(()=>{ if(!dragging) idle = true; }, 1400); }

  rig.addEventListener('pointerdown', e => { down(e.clientX); rig.setPointerCapture(e.pointerId); });
  window.addEventListener('pointermove', e => move(e.clientX));
  window.addEventListener('pointerup', up);

  function loop(){
    if (dragging) { vel *= 0.9; }
    else if (idle) { angle += 0.12; }
    else { angle += vel; vel *= 0.94; if (Math.abs(vel) < 0.01) vel = 0; }
    render();
    requestAnimationFrame(loop);
  }
  render();
  loop();
  window.__setAngle = function(a){ idle = false; angle = a; vel = 0; render(); };
})();
</script>
