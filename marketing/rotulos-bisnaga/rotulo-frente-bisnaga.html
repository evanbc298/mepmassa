<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MEP Bisnaga — Rótulo Frente Único (180x480mm)</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#ddd; font-family:'Barlow',sans-serif; }
.sheet { display:flex; flex-direction:column; gap:24px; padding:24px; width:fit-content; }

.label {
  position:relative;
  width:180mm;
  height:480mm;
  background:#fff;
  overflow:hidden;
}
.silhouette {
  position:absolute;
  inset:0;
  clip-path: polygon(0% 0%, 100% 0%, 100% 80%, 50% 100%, 0% 80%);
}

/* ORANGE HEADER */
.hdr {
  position:absolute; top:0; left:0; width:100%; height:126mm;
  background:#F28C28;
  display:flex; flex-direction:column; align-items:center;
  padding-top:11mm;
}
.hdr-logo { width:20mm; height:auto; }
.hdr-word {
  font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:13mm;
  color:#1A2B4D; letter-spacing:-0.01em; line-height:1; margin-top:3mm;
}
.hdr-sub {
  font-family:'Barlow',sans-serif; font-weight:700; font-size:4mm;
  color:#fff; letter-spacing:0.14em; text-transform:uppercase; margin-top:2mm; text-align:center;
}
.hdr-badges { display:flex; gap:6mm; margin-top:7mm; }
.badge {
  background:#1A2B4D; border-radius:2mm; padding:3.2mm 6mm; text-align:center; min-width:36mm;
}
.badge .b-label { font-size:2.6mm; font-weight:700; color:rgba(255,255,255,.55); text-transform:uppercase; letter-spacing:.08em; }
.badge .b-val { font-size:5.8mm; font-weight:800; color:#F28C28; font-family:'Barlow Condensed',sans-serif; line-height:1.1; margin-top:.5mm; }

/* WHITE BAND */
.wht {
  position:absolute; top:126mm; left:0; width:100%; height:38mm;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.8mm;
  border-bottom:0.4mm solid #eceef1;
}
.wht-title { font-size:5.8mm; font-weight:800; color:#1A2B4D; letter-spacing:-0.01em; }
.wht-sub { font-size:3.2mm; font-weight:500; color:#6b7280; }
.wht-pill {
  margin-top:1mm; background:rgba(242,140,40,0.14); color:#c06a00; font-weight:700;
  font-size:2.8mm; text-transform:uppercase; letter-spacing:.12em; padding:1.4mm 5mm; border-radius:10mm;
}

/* ÁREA RESERVADA — ETIQUETA COLADA (produto gerado à parte) */
.sticker-zone {
  position:absolute; top:240mm; left:15mm; width:150mm; height:68mm;
  background:#fff;
  border:0.6mm dashed #b7bcc4;
  border-radius:2mm;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5mm;
}
.sz-label { font-size:3mm; font-weight:700; color:#9aa0aa; text-transform:uppercase; letter-spacing:.1em; text-align:center; }
.sz-dim { font-family:'Barlow Condensed',sans-serif; font-size:5mm; font-weight:800; color:#c3c8d1; letter-spacing:.02em; }
.sz-corner { position:absolute; width:6mm; height:6mm; }
.sz-corner.tl { top:-0.6mm; left:-0.6mm; border-top:0.8mm solid #9aa0aa; border-left:0.8mm solid #9aa0aa; }
.sz-corner.tr { top:-0.6mm; right:-0.6mm; border-top:0.8mm solid #9aa0aa; border-right:0.8mm solid #9aa0aa; }
.sz-corner.bl { bottom:-0.6mm; left:-0.6mm; border-bottom:0.8mm solid #9aa0aa; border-left:0.8mm solid #9aa0aa; }
.sz-corner.br { bottom:-0.6mm; right:-0.6mm; border-bottom:0.8mm solid #9aa0aa; border-right:0.8mm solid #9aa0aa; }

/* TAPER FOOT */
.foot {
  position:absolute; top:384mm; left:0; width:100%; height:96mm;
  background:#1A2B4D;
  display:flex; flex-direction:column; align-items:center; padding-top:14mm;
}
.foot-logo { width:11mm; height:auto; }
.foot-url { margin-top:3mm; font-size:3mm; font-weight:700; color:rgba(255,255,255,.4); letter-spacing:.1em; }

/* CUT GUIDE (visual only, not printed) */
.guide {
  position:absolute; inset:0; pointer-events:none;
  clip-path: polygon(0% 0%, 100% 0%, 100% 80%, 50% 100%, 0% 80%);
  outline: 0.5mm dashed rgba(0,0,0,.25); outline-offset:-0.5mm;
}
</style>
</head>
