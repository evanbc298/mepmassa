<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Balneário Camboriú — 62 Anos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; font-family:'Barlow',sans-serif; }

.story {
  position:relative;
  width:1080px; height:1920px;
  overflow:hidden;
  background:#0f1932;
}
.bg {
  position:absolute; inset:0;
  background:url('foto-roda-gigante-bc.jpg') center 38% / cover no-repeat;
}
.ov-grad {
  position:absolute; inset:0;
  background:
    linear-gradient(0deg, rgba(15,25,50,.98) 0%, rgba(15,25,50,.90) 20%, rgba(15,25,50,.15) 46%, rgba(15,25,50,0) 62%),
    linear-gradient(180deg, rgba(15,25,50,.55) 0%, rgba(15,25,50,0) 22%);
}

.content {
  position:absolute; left:0; right:0; bottom:0;
  padding:0 76px 96px;
  display:flex; flex-direction:column; gap:22px;
}
.eyebrow {
  font-size:22px; font-weight:700; letter-spacing:.32em; text-transform:uppercase;
  color:#F28C28;
}
.rule { width:64px; height:4px; background:#F28C28; }
.title {
  font-family:'Barlow',sans-serif; font-weight:700; font-size:64px; line-height:1.08;
  color:#fff; letter-spacing:-0.01em; max-width:880px;
}
.years-row { display:flex; align-items:baseline; gap:18px; margin-top:2px; }
.years-num {
  font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:168px; line-height:.85;
  color:#F28C28; letter-spacing:-0.02em;
}
.years-label {
  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:44px;
  color:#fff; text-transform:uppercase; letter-spacing:.04em;
}
.sub {
  font-size:26px; font-weight:500; color:rgba(255,255,255,.62); line-height:1.55; max-width:760px; margin-top:6px;
}

.foot {
  margin-top:26px; padding-top:26px; border-top:1px solid rgba(255,255,255,.14);
  display:flex; align-items:center; justify-content:space-between;
}
.brand { display:flex; align-items:center; gap:14px; }
.brand-logo { height:36px; width:auto; }
.brand-name { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:24px; color:rgba(255,255,255,.75); letter-spacing:.1em; }
.brand-city { font-size:17px; font-weight:500; color:rgba(255,255,255,.4); }
</style>
</head>
<body>
<div class="story">
  <div class="bg"></div>
  <div class="ov-grad"></div>
  <div class="content">
    <div class="eyebrow">20 de julho · 1964</div>
    <div class="rule"></div>
    <div class="title">Parabéns,<br>Balneário Camboriú!</div>
    <div class="years-row">
      <div class="years-num">62</div>
      <div class="years-label">Anos</div>
    </div>
    <div class="sub">Orgulho de fazer parte dessa história — e de construir, todos os dias, junto com essa cidade que a gente ama.</div>

      <div class="brand">

  </div>
</div>
</body>
</html>
