<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700;900&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:768px; background:#0d1730; font-family:'Barlow',sans-serif; overflow:hidden; position:relative; }
  .eyebrow { position:absolute; top:56px; left:64px; font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:700; letter-spacing:0.32em; text-transform:uppercase; color:#F28C28; }
  .rule { position:absolute; top:104px; left:64px; width:80px; height:4px; background:#F28C28; }
  .list { position:absolute; top:150px; left:64px; right:64px; display:flex; flex-direction:column; gap:34px; }
  .item { display:flex; align-items:center; gap:22px; }
  .dot { width:14px; height:14px; border-radius:50%; background:#F28C28; flex-shrink:0; }
  .txt { font-size:44px; font-weight:700; color:#ffffff; letter-spacing:-0.01em; }
</style>
</head>
<body>
  <div class="eyebrow">Etapa 2 · Aplicação</div>
  <div class="rule"></div>
  <div class="list">
    <div class="item"><div class="dot"></div><div class="txt">Direto da embalagem</div></div>
    <div class="item"><div class="dot"></div><div class="txt">Sem tempo de espera</div></div>
    <div class="item"><div class="dot"></div><div class="txt">Pronto pra próxima fiada</div></div>
  </div>
</body>
</html>
