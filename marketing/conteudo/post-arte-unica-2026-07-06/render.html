<style>
  :root {
    --navy:   #1A2B4D;
    --navy-d: #0d1b35;
    --orange: #F28C28;
    --white:  #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
  }

  .post {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      110deg,
      rgba(9,18,36,0.82) 0%,
      rgba(13,27,53,0.65) 38%,
      rgba(13,27,53,0.30) 65%,
      rgba(13,27,53,0.08) 100%
    );
  }

  .left-bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 7px;
    background: var(--orange);
    z-index: 5;
  }

  .content {
    position: absolute;
    inset: 0;
    padding: 60px 65px 55px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 10;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .logo-name {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }

  .middle {
    display: flex;
    flex-direction: column;
    gap: 35px;
  }
  .eyebrow {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--orange);
  }
  .headline {
    font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 900;
    font-size: 118px;
    line-height: 0.88;
    color: var(--white);
    text-transform: uppercase;
    letter-spacing: -0.02em;
  }
  .headline em {
    font-style: normal;
    color: var(--orange);
  }
  .subhead {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 32px;
    font-weight: 500;
    color: rgba(255,255,255,0.5);
    line-height: 1.55;
    max-width: 550px;
    margin-top: 10px;
  }

  .bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .bottom-text {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .accent-tag {
    display: inline-flex;
    align-items: center;
    gap: 15px;
    background: var(--orange);
    color: var(--white);
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 10px 20px;
    align-self: flex-start;
  }
  .site {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 25px;
    color: rgba(255,255,255,0.35);
    font-weight: 600;
    letter-spacing: 0.08em;
  }

  .macro-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .macro-circle {
    width: 270px;
    height: 270px;
    border-radius: 50%;
    overflow: hidden;
    border: 5px solid rgba(255,255,255,0.25);
    box-shadow: 0 20px 70px rgba(0,0,0,0.55);
    position: relative;
  }
  .macro-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transform: scale(1.08);
  }
  .macro-label {
    position: absolute;
    bottom: -45px;
    left: 50%;
    transform: translateX(-50%);
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    white-space: nowrap;
  }

  .accent-line {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 10px;
    background: var(--orange);
    z-index: 10;
  }
</style>
