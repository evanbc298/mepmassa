<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MEP 20 — Conceito Reel</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #02040A;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
  font-family: Arial, sans-serif;
}

.meta-label {
  color: rgba(255,255,255,0.28);
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 16px;
  font-family: Arial, sans-serif;
}

/* 9:16 Reel frame */
.frame {
  position: relative;
  width: min(360px, 92vw);
  aspect-ratio: 9/16;
  overflow: hidden;
  border-radius: 6px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04),
    0 0 80px rgba(242,140,40,0.10),
    0 30px 80px rgba(0,0,0,0.7);
}

/* ── Layer 0: base background ── */
.bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 110% 55% at 50% -5%, #1C2A45 0%, #06090E 58%),
    linear-gradient(to top, #0A0600 0%, transparent 50%);
}

/* Scaffolding grid lines */
.scaffold {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 36px 36px;
  background-position: 0 0;
}

/* ── Layer 1: particle canvas ── */
#particles {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ── Layer 2: spotlight cone ── */
.spotlight {
  position: absolute;
  top: -30%;
  left: 50%;
  transform: translateX(-50%);
  width: 260%;
  height: 130%;
  background: radial-gradient(ellipse 28% 75% at 50% 2%,
    rgba(242,140,40,0.14) 0%,
    rgba(242,140,40,0.07) 35%,
    transparent 68%
  );
  pointer-events: none;
}

/* ── Layer 3: worker silhouettes ── */
.workers {
  position: absolute;
  bottom: 27%;
  left: 0;
  right: 0;
  height: 80px;
  pointer-events: none;
}

/* ── Layer 4: product barrica ── */
.product {
  position: absolute;
  bottom: 26%;
  left: 50%;
  transform: translateX(-50%);
  width: 52%;
  filter:
    drop-shadow(0 0 40px rgba(242,140,40,0.20))
    drop-shadow(0 0 12px rgba(242,140,40,0.10))
    drop-shadow(0 24px 24px rgba(0,0,0,0.75));
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateX(-50%) translateY(0px); }
  50%       { transform: translateX(-50%) translateY(-6px); }
}

/* ── 4× badge ── */
.badge {
  position: absolute;
  top: 42%;
  right: 5%;
  background: #F28C28;
  color: white;
  font-family: Impact, 'Arial Narrow', Arial, sans-serif;
  text-align: center;
  padding: 8px 10px 6px;
  line-height: 1;
  transform: rotate(3deg);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.badge .big { font-size: 32px; display: block; }
.badge .small { font-size: 9px; letter-spacing: 1.5px; display: block; margin-top: 2px; }

/* ── MEP logo top-left ── */
.logo-top {
  position: absolute;
  top: 20px;
  left: 18px;
  width: 48px;
  opacity: 0.88;
}

/* ── Product label top-right ── */
.label-top {
  position: absolute;
  top: 16px;
  right: 16px;
  text-align: right;
  line-height: 1;
}
.label-top .eyebrow {
  display: block;
  font-size: 7.5px;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.38);
  text-transform: uppercase;
  margin-bottom: 3px;
  font-family: Arial, sans-serif;
}
.label-top .num {
  font-size: 38px;
  font-weight: 900;
  font-family: Impact, 'Arial Narrow', Arial, sans-serif;
  color: white;
  letter-spacing: 0;
  line-height: 1;
}
.label-top .sub {
  display: block;
  font-size: 7.5px;
  letter-spacing: 3px;
  color: #F28C28;
  text-transform: uppercase;
  margin-top: 3px;
  font-family: Arial, sans-serif;
}

/* ── Ground mist ── */
.ground-mist {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 30%;
  background: linear-gradient(to top, rgba(6,9,14,1) 0%, rgba(6,9,14,0.6) 50%, transparent 100%);
  pointer-events: none;
}

/* ── Bottom content block ── */
.bottom-block {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 18px 20px 20px;
}

.bullets {
  list-style: none;
  margin-bottom: 14px;
}
.bullets li {
  font-size: 12.5px;
  color: rgba(255,255,255,0.82);
  font-family: 'Arial Narrow', Arial, sans-serif;
  letter-spacing: 0.3px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.bullets li::before {
  content: '✔';
  color: #F28C28;
  font-size: 10px;
  flex-shrink: 0;
}

.tagline {
  font-size: 18px;
  font-weight: 900;
  font-family: Impact, 'Arial Narrow', Arial, sans-serif;
  color: white;
  letter-spacing: 2px;
  text-transform: uppercase;
  line-height: 1.1;
}
.tagline em {
  color: #F28C28;
  font-style: normal;
}

.bottom-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.website {
  font-size: 9px;
  letter-spacing: 2.5px;
  color: rgba(255,255,255,0.32);
  text-transform: uppercase;
  font-family: Arial, sans-serif;
}
.insta {

  letter-spacing: 1px;
  color: #F28C28;
  font-family: Arial, sans-serif;
}
</style>

<script>
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const frame = canvas.parentElement;

  function resize() {
    canvas.width  = frame.offsetWidth;
    canvas.height = frame.offsetHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COUNT = 180;
  const particles = [];

  function randomColor() {
    const r = 185 + Math.random() * 35;
    const g = 140 + Math.random() * 35;
    const b = 55  + Math.random() * 40;
    return [r, g, b];
  }

  class Particle {
    constructor(spreadY) {
      this.reset(spreadY);
    }
    reset(spreadY) {
      this.x   = Math.random() * canvas.width;
      this.y   = spreadY !== undefined ? Math.random() * canvas.height : canvas.height + 10;
      this.r   = Math.random() * 3.5 + 0.5;
      this.vx  = (Math.random() - 0.5) * 0.6;
      this.vy  = -(Math.random() * 1.4 + 0.3);
      this.a   = Math.random() * 0.65 + 0.1;
      this.da  = 0.0015 + Math.random() * 0.003;
      const [r,g,b] = randomColor();
      this.r_ = r; this.g_ = g; this.b_ = b;
      // small chance of being a rectangular "chip"
      this.rect = Math.random() < 0.12;
      this.w = this.rect ? this.r * 3 : 0;
      this.h = this.rect ? this.r * 1.5 : 0;
      this.rot = Math.random() * Math.PI;
    }
    update() {
      this.x  += this.vx;
      this.y  += this.vy;
      this.a  -= this.da;
      this.rot += 0.01;
      if (this.a <= 0 || this.y < -20) this.reset();
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.a);
      ctx.fillStyle = `rgb(${this.r_},${this.g_},${this.b_})`;
      if (this.rect) {
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
      } else {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  for (let i = 0; i < COUNT; i++) particles.push(new Particle(true));

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) { p.update(); p.draw(); }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
